<section class="d_ProductPage">
  <div class="d_ProductPage__details">
    <!-- Imagen del producto -->
    <div class="d_ProductPage__imageWrapper">
      <img [src]="productImage()" [alt]="productName()" class="d_ProductPage__productImage">
    </div>

    <!-- Información y Acciones -->
    <div class="d_ProductPage__productInformation">
      <h1 class="d_ProductPage__title">{{ productName() }}</h1>
      <p class="d_ProductPage__description">
        {{ productDescription() }}
      </p>

      <div class="d_ProductPage__variants">
        <span class="variant-option"><span class="dot" style="background: #a52a2a;"></span> Ruby Red</span>
        <span class="variant-option"><span class="dot" style="background: #1a1a1a;"></span> Midnight Onyx</span>
      </div>

      <div class="d_ProductPage__purchase">
        <div class="purchase-info">
          <span class="price">{{ productPrice() }}</span>
          <span class="stock">9 in stock, free shipping</span>
        </div>
        <button class="d_ProductPage__addButton" (click)="addToCart()">ADD TO BASKET</button>
      </div>
    </div>
  </div>
</section>
