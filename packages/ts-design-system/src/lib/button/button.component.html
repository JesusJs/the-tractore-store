<button
  [type]="type()"
  [disabled]="disabled()"
  (click)="btnClick.emit($event)"
  class="ds-btn w-full flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed"
  [class.ds-btn--primary]="variant() === 'primary'"
  [class.ds-btn--secondary]="variant() === 'secondary'"
  [class.ds-btn--accent]="variant() === 'accent'"
  [class.ds-btn--disabled]="disabled()"
>
  <ng-content></ng-content>
</button>
