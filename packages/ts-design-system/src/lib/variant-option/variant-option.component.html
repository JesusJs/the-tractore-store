<div class="flex flex-wrap gap-2">
  @for (option of options(); track option) {
    <button 
      (click)="selected.set(option)"
      class="py-1.5 px-3 rounded-lg text-xs font-semibold border transition-all duration-200 cursor-pointer"
      [ngClass]="{
        'bg-token-primary-opacity border-token-primary text-token-primary font-bold': selected() === option,
        'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700': selected() !== option
      }"
    >
      {{ option }}
    </button>
  }
</div>
