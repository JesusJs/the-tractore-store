<section class="e_CartPage">
  <h2 class="e_CartPage__title">Basket</h2>

  <div class="e_CartPage__content">
    @if (items().length === 0) {
      <div class="e_CartPage__empty">Your basket is empty.</div>
    } @else {
      @for (item of items(); track item.variantId) {
        <!-- Fila del producto -->
        <div class="e_CartPage__item">
          <img [src]="item.image" [alt]="item.productName" class="e_CartPage__itemImage">
          
          <div class="e_CartPage__itemDetails">
            <h3 class="e_CartPage__itemName">{{ item.productName }}</h3>
            <p class="e_CartPage__itemSku">{{ item.variantName }}</p>
          </div>

          <div class="e_CartPage__itemQty">{{ item.quantity }}</div>
          
          <button class="e_CartPage__removeBtn" (click)="removeItem.emit(item.variantId)">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 1L13 13M13 1L1 13" />
            </svg>
          </button>
          
          <div class="e_CartPage__itemPrice">${{ item.price * item.quantity | number:'1.0-0' }} USD</div>
        </div>
      }

      <!-- Línea divisoria -->
      <hr class="e_CartPage__divider">

      <!-- Total -->
      <div class="e_CartPage__totalRow">
        <span>Total: ${{ total() | number:'1.0-0' }} USD</span>
      </div>
    }

    <!-- Botones de acción -->
    <div class="e_CartPage__actions">
      <button class="e_CartPage__actionBtn e_CartPage__actionBtn--continue" (click)="continueShoppingClick.emit()">CONTINUE SHOPPING</button>
      <button class="e_CartPage__actionBtn e_CartPage__actionBtn--checkout" (click)="checkoutClick.emit()">CHECKOUT</button>
    </div>
  </div>
</section>
