<div class="ds-card flex flex-col justify-between h-full w-full">

  <!-- Upper: Image + Details -->
  <div>
    <!-- Image -->
    <div class="ds-card__image-wrap">
      <img
        [src]="image() || 'https://placehold.co/600x380/f5f5f5/666666?text=Tractor+Store'"
        [alt]="title()"
        class="ds-card__image"
        (error)="$any($event.target).src = 'https://placehold.co/600x380/f5f5f5/666666?text=Tractor+Store'"
      />
      <span class="ds-card__badge">{{ brand() }}</span>
    </div>

    <!-- Body: Title, Description, Price -->
    <div class="ds-card__body">
      <h4 class="ds-card__title">{{ title() }}</h4>

      <p class="ds-card__description">{{ description() }}</p>

      <div class="ds-card__price-row">
        <span class="ds-card__price-label">Precio</span>
        <span class="ds-card__price">
          ${{ price() | number:'1.0-0' }} USD
        </span>
      </div>

      <!-- Variant selector -->
      <div class="space-y-2 mb-2">
        <span class="ds-card__variants-label">Configuración</span>
        <ds-variant-option
          [options]="variants()"
          [(selected)]="selectedVariant">
        </ds-variant-option>
      </div>
    </div>
  </div>

  <!-- Footer: CTA button -->
  <div class="ds-card__footer">
    <ds-button
      variant="accent"
      [disabled]="!selectedVariant()"
      (btnClick)="onAddToCartClick()">
      <span class="flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m12-9l2 9m-9-4h4"/>
        </svg>
        Agregar al Carrito
      </span>
    </ds-button>
  </div>

</div>
