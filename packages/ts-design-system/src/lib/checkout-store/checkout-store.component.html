<div class="e_StorePicker_dialog">
  <div class="e_StorePicker_dialog__header">
    <h3 class="e_StorePicker_dialog__title">Choose a store</h3>
    <button class="e_StorePicker_dialog__close">×</button>
  </div>

  <div class="e_StorePicker_dialog__search">
    <input type="text" placeholder="Search by city or zip code" />
  </div>

  <div class="e_StorePicker_dialog__list">
    <!-- Item de tienda -->
    <div class="e_StorePicker_dialog__item">
      <div class="e_StorePicker_dialog__info">
        <span class="e_StorePicker_dialog__name">Tractor Store - North</span>
        <span class="e_StorePicker_dialog__addr">123 Farm Rd, Springfield</span>
      </div>
      <button class="e_StorePicker_dialog__select">SELECT</button>
    </div>

    <!-- Item de tienda -->
    <div class="e_StorePicker_dialog__item">
      <div class="e_StorePicker_dialog__info">
        <span class="e_StorePicker_dialog__name">Tractor Store - Downtown</span>
        <span class="e_StorePicker_dialog__addr">456 Main St, Metropolis</span>
      </div>
      <button class="e_StorePicker_dialog__select">SELECT</button>
    </div>
  </div
