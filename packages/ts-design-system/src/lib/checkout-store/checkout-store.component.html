<div class="e_StorePicker_dialog">
  <div class="e_StorePicker_dialog__header">
    <h3 class="e_StorePicker_dialog__title">Choose a store</h3>
    <button class="e_StorePicker_dialog__close" (click)="close.emit()">×</button>
  </div>

  <div class="e_StorePicker_dialog__list">
    @for (store of stores(); track store.id) {
      <!-- Item de tienda -->
      <div class="e_StorePicker_dialog__item">
        <div class="e_StorePicker_dialog__info">
          <span class="e_StorePicker_dialog__name">{{ store.name }}</span>
          <span class="e_StorePicker_dialog__addr">{{ store.address }}, {{ store.city }}</span>
        </div>
        <button class="e_StorePicker_dialog__select" (click)="select.emit(store.id)">SELECT</button>
      </div>
    } @empty {
      <div class="e_StorePicker_dialog__empty">No stores available.</div>
    }
  </div>
</div>
