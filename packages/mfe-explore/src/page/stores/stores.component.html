<section class="e_OurStores">
  <h1 class="e_OurStores__title">Our Stores</h1>
  <p class="e_OurStores__description">
    Want to see our tractors in person? Visit one of our stores to talk to our experts and see the machines up close.
  </p>

  @if (isLoading()) {
    <div class="e_OurStores__loading">
      <div class="e_OurStores__spinner"></div>
    </div>
  } @else {
    <div class="e_OurStores__grid">
      @for (store of stores(); track store.id) {
        <article class="e_OurStores__card">
          <img [src]="store.image" [alt]="store.name" class="e_OurStores__image" />
          <div class="e_OurStores__info">
            <h3 class="e_OurStores__name">{{ store.name }}</h3>
            <p class="e_OurStores__address">{{ store.address }}</p>
            <p class="e_OurStores__city">
              <span class="e_OurStores__cityIcon">📍</span>
              {{ store.city }}
            </p>
            <p class="e_OurStores__storeId">Store ID: <code>{{ store.id }}</code></p>
          </div>
        </article>
      }
    </div>
  }
</section>
