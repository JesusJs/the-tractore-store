<div class="e_HomePage">
  @if (isLoading()) {
  <div class="e_HomePage__loading">
    <div class="e_HomePage__spinner"></div>
  </div>
  } @else {
  <div class="grid">
    @for (teaser of teasers(); track teaser.id) {
    <a class="e_HomePage__categoryLink" [attr.data-title]="teaser.title" [routerLink]="['/mfe_explore/machines']"
      [queryParams]="{ filter: teaser.filter }">
      <img [src]="teaser.image" [alt]="teaser.title" />
    </a>
    }
  </div>
  }
</div>
