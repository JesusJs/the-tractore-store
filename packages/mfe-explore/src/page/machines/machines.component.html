<section class="e_CategoryPage">
  <!-- Cabecera y Filtros -->
  <header class="e_CategoryPage__header">
    <h1 class="e_CategoryPage__title">{{ pageTitle() }}</h1>
    <div class="e_CategoryPage__filter">
      <span>Filter:</span>
      @for (f of availableFilters(); track f) {
        <button
          class="filter-btn"
          [class.is-active]="selectedFilter() === f"
          (click)="setFilter(f)"
        >{{ f | titlecase }}</button>
      }
    </div>
  </header>

  <!-- Loading -->
  @if (isLoading()) {
    <div class="e_CategoryPage__loading">
      <div class="e_CategoryPage__spinner"></div>
    </div>
  } @else {
    <!-- Cuadrícula de productos con ds-product-card -->
    <div class="e_CategoryPage__grid">
      @for (product of products(); track product.id) {
        <ds-product-card
          [id]="product.id"
          [title]="product.name"
          [brand]="product.brand"
          [price]="product.price"
          [image]="product.image"
          [variants]="product.variants"
          [description]="product.description"
          (addToCart)="onAddToCart($event)"
          [routerLink]="['/mfe_decide']"
          [queryParams]="{ id: product.id }"
        />
      }
    </div>

  }
</section>
