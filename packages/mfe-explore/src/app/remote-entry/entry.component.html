<main class="landing-page max-w-7xl mx-auto px-6 py-12">
  
  <!-- ================= HERO SECTION: TWO COLUMN LAYOUT ================= -->
  <section class="hero-section grid grid-cols-1 md:grid-cols-2 gap-8 mb-20">
    @for (hero of heroCategories; track hero.id) {
      <div 
        (click)="navigateToCategory(hero.route)"
        class="hero-card relative overflow-hidden rounded-[24px] cursor-pointer group shadow-lg"
      >
        <!-- Background Image -->
        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/5 transition-colors z-10"></div>
        <img 
          [src]="hero.image" 
          [alt]="hero.label" 
          class="w-full h-[400px] object-cover transform scale-100 group-hover:scale-[1.03] transition-transform duration-700"
        />

        <!-- Floating Badge/Text Container -->
        <div class="absolute bottom-6 left-6 right-6 bg-white/95 backdrop-blur-sm p-6 rounded-[20px] shadow-lg z-20 transform translate-y-0 group-hover:-translate-y-1 transition-transform duration-300">
          <span class="text-[11px] font-extrabold uppercase tracking-[0.25em] text-red-500 block mb-2">Category</span>
          <h2 class="text-slate-900 font-bold text-2xl mb-1 font-serif">{{ hero.label }}</h2>
          <p class="text-slate-500 text-sm font-sans leading-relaxed">{{ hero.sublabel }}</p>
        </div>
      </div>
    }
  </section>

  <!-- ================= EXPLORE / RECOMMENDATIONS SECTION ================= -->
  <section class="explore-section">
    <div class="flex items-center justify-between mb-8">
      <div>
        <span class="text-[11px] font-extrabold uppercase tracking-[0.25em] text-red-500 block mb-2">Explore Our Range</span>
        <h3 class="text-slate-900 font-bold text-3xl font-serif">Recommendations</h3>
      </div>
    </div>

    <!-- Horizontal scrollable container for product cards -->
    <div class="carousel-container overflow-x-auto pb-8 -mx-6 px-6 scrollbar-thin">
      <div class="flex gap-8 min-w-max">
        @for (tractor of recommendations; track tractor.id) {
          <div class="w-[340px] flex-shrink-0">
            <ds-product-card
              [id]="tractor.id"
              [title]="tractor.name"
              [brand]="tractor.brand"
              [price]="tractor.price"
              [image]="tractor.image"
              [variants]="tractor.variants"
              [description]="tractor.description"
              [selectedVariant]="getVariant(tractor.id)"
              (selectedVariantChange)="setVariant(tractor.id, $event)"
              (addToCart)="onAddToCart($event)"
            ></ds-product-card>
          </div>
        }
      </div>
    </div>
  </section>

</main>
