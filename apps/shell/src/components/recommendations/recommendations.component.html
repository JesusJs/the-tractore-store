<section class="e_recommendation">
  <h2 class="e_recommendation__title">Recommendations</h2>

  @if (isLoading()) {
  <div class="e_recommendation__loading">
    <div class="e_recommendation__spinner"></div>
  </div>
  } @else {
  <div class="e_recommendation__container">
    @for (rec of recommendations(); track rec.id) {
    <article class="e_recommendation__card" [routerLink]="['/mfe_decide']" [queryParams]="{ id: rec.id }">
      <div class="e_recommendation__image-placeholder">
        @if (rec.image) {
        <img [src]="rec.image" [alt]="rec.name" class="e_recommendation__image" />
        } @else {
        <span>Product Image</span>
        }
      </div>
      <div class="e_recommendation__content">
        <h3 class="e_recommendation__name">{{ rec.name }}</h3>
      </div>
    </article>
    } @empty {
    <p class="e_recommendation__empty">No recommendations available.</p>
    }
  </div>
  }
</section>
