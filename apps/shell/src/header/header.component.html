
<!-- CABECERA PRINCIPAL (HEADER) -->
<header class="w-full bg-white border-b border-gray-100 premium-header-shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
        
        <!-- ================= LADO IZQUIERDO: LOGO RETRO VECTORIAL ================= -->
        <a href="#" class="flex flex-col select-none group focus:outline-none">
            <!-- SVG de alta definición que calca perfectamente el logotipo de Tractor Store -->
            <svg class="h-14 w-auto transform transition-transform duration-200 group-hover:scale-[1.01]" viewBox="0 0 350 75" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Subtexto "MICROFRONTENDS" en tipografía sans-serif de peso ancho con tracking extremo -->
                <text x="18" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-style="italic" font-size="11" fill="#1e293b" letter-spacing="1.2">MICROFRONTENDS</text>
                
                <!-- Trazo de fondo curvo rojo (Swoosh de época retro) -->
                <path d="M 12 64 Q 90 40, 170 50 T 330 50 Q 275 60, 18 68 Z" fill="var(--ts-primary)" opacity="0.95" />
                
                <!-- Letras "Tractor Store" con tipografía Serif clásica y cursiva elegante -->
                <text x="12" y="52" font-family="'Georgia', serif" font-weight="900" font-style="italic" font-size="44" fill="var(--ts-primary)" letter-spacing="-1.5">Tractor Store</text>
            </svg>
        </a>

        <!-- ================= CENTRO: TABS DE NAVEGACIÓN COMPACTAS ================= -->
        <nav class="flex items-center gap-6">
            <!-- Enlace: MACHINES -->
            <a href="#" class="tab-pill px-6 py-2.5 rounded-lg text-[11px] font-bold uppercase tracking-[0.25em] text-slate-600 hover:text-black">
                MACHINES
            </a>

            <!-- Enlace: STORES -->
            <a href="#" class="tab-pill px-6 py-2.5 rounded-lg text-[11px] font-bold uppercase tracking-[0.25em] text-slate-600 hover:text-black">
                STORES
            </a>
        </nav>

        <!-- ================= LADO DERECHO: CARRO DE COMPRAS CIRCULAR ================= -->
        <div class="flex items-center justify-center">
            <button class="cart-circle w-14 h-14 flex items-center justify-center rounded-full focus:outline-none">
                <!-- Icono minimalista de la bolsa de compras con trazo suave -->
                <svg class="w-6 h-6 text-slate-700" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>

        </div>

    </div>
